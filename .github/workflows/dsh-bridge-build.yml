name: DSH Bridge Build

# 说明：
# - 只产出安装包并上传 artifact；打 `dsh-v*` tag 或手动勾选 release 时才创建 Release。
# - 安装包未签名，Windows 会有 SmartScreen 提示，macOS 需要右键打开，属预期行为。
on:
  workflow_dispatch:
    inputs:
      release:
        description: '构建完成后创建 GitHub Release'
        type: boolean
        default: true
  push:
    tags:
      - 'dsh-v*'

permissions:
  contents: write

env:
  IS_CI: 'true'

concurrency:
  group: dsh-bridge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (setup + portable)
        run: |
          npm run pack:win:setup:x64
          npm run pack:win:7z:x64

      - name: Checksums
        run: |
          Get-ChildItem build\*.exe, build\*.7z | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name
          } | Set-Content build\SHA256SUMS-win.txt

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            build/*.exe
            build/*.7z
            build/SHA256SUMS-win.txt
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (dmg x64 + arm64)
        run: |
          npm run pack:mac:dmg
          npm run pack:mac:dmg:arm64

      - name: Checksums
        run: |
          cd build && shasum -a 256 *.dmg > SHA256SUMS-mac.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            build/*.dmg
            build/SHA256SUMS-mac.txt
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (AppImage + deb)
        run: |
          npm run pack:linux:appImage
          npm run pack:linux:deb:amd64

      - name: Checksums
        run: |
          cd build && sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/*.AppImage
            build/*.deb
            build/SHA256SUMS-linux.txt
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' || inputs.release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.7z' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'SHA256SUMS-*' \) -exec cp {} out/ \;
          ls -lh out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dsh-v$(node -p "require('./package.json').version")-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "LX Music DSH Bridge $TAG" \
            --notes "非官方分支，仅供 DeepSeek Harness 插件 dsh-music-dj 联动使用。

- 构建自提交：${{ github.sha }}
- 安装包未签名：Windows 可能有 SmartScreen 提示，macOS 需右键「打开」。
- 本分支不改动洛雪的音源机制，也不内置任何音源，需自行导入音源脚本。"
